<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Complaint - CivicConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏙️ CivicConnect</h1>
        <p>Track Your Complaint</p>
    </header>

    <main>

        <h2>🔍 Complaint Tracking</h2>

        <p>Enter your Complaint ID</p>

        <input
            type="text"
            id="complaintId"
            placeholder="Example: CC1234"
        >

        <br><br>

        <button onclick="trackComplaint()">
            Track Complaint
        </button>

        <div id="trackResult"></div>

        <br>

        <a href="index.html">
            <button>⬅️ Back to Home</button>
        </a>

    </main>

    <footer>
        <p>© 2026 CivicConnect</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
